name: Performance Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC
  workflow_dispatch:
    inputs:
      users:
        description: "Virtual users"
        default: "10"
      loops:
        description: "Loops per user"
        default: "5"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  JMETER_VERSION: "5.6.3"
  MAX_ERROR_PCT: "2"
  MAX_P95_MS: "5000"

jobs:
  load-test:
    name: JMeter load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache JMeter
        id: cache
        uses: actions/cache@v4
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Download JMeter
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz | tar xz

      - name: Run load test (non-GUI)
        run: |
          mkdir -p results
          apache-jmeter-${JMETER_VERSION}/bin/jmeter -n \
            -t perf/booking-load.jmx \
            -Jusers=${{ github.event.inputs.users || '10' }} \
            -Jloops=${{ github.event.inputs.loops || '5' }} \
            -Jjmeter.save.saveservice.output_format=csv \
            -l results/results.jtl \
            -e -o results/dashboard

      - name: Check performance limits
        run: python3 scripts/check_thresholds.py results/results.jtl | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmeter-results
          path: results/

      - name: Upload dashboard for Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: results/dashboard

  publish:
    name: Publish dashboard to GitHub Pages
    needs: load-test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
